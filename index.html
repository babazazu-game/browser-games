<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Merge-оборона</title>
  <style>
    html, body { margin: 0; min-height: 100%; background: #101813; overflow: hidden; }
    body { display: grid; place-items: center; font-family: system-ui, sans-serif; }
    canvas { max-width: 100vw; max-height: 100vh; box-shadow: 0 14px 60px #0009; }
    #asset-error { position: fixed; z-index: 99; inset: 20%; display: grid; place-items: center; padding: 32px; white-space: pre-wrap; text-align: center; color: #fff; background: #641c24; border: 4px solid #ff8e8e; font: 700 22px/1.5 system-ui; }
    #asset-error[hidden] { display: none; }
  </style>
</head>
<body>
  <main id="game"></main>
  <div id="asset-error" hidden></div>
  <script src="assets/vendor/phaser.min.js"></script>
  <script src="game.js"></script>
</body>
</html>
